[package]
name = "simulador-memoria-y-cache"
version = "0.2.0"
edition = "2021"
description = "Simulador interactivo de jerarquia de memoria y cache en Rust + Yew (WebAssembly)"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
gloo-timers = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Window",
] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
